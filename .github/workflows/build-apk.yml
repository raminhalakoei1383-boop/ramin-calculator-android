name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf automake autopoint gettext libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer and Android build tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install legacy-cgi cython==0.29.34

      - name: Build Android APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ramin-calculator-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
